[project]
name = "amocrm-1c-resilient-gateway"
version = "1.0.0"
description = "Resilient AmoCRM -> 1C integration gateway (HMAC, SQLite WAL, circuit breaker, n8n DLQ)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.0",
    "fastapi>=0.110",
    "httpx>=0.27",
    "pytest>=8.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["gateway", "gateway.contracts"]